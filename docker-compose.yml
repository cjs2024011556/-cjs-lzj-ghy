# ============================================
# A1 设备检修智能系统 - Docker Compose
# 适用于开发与 LoongArch + 麒麟生产部署
# ============================================

version: '3.9'

services:
  # ---- PostgreSQL ----
  postgres:
    image: postgres:15-alpine
    container_name: a1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-a1_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-a1_password}
      POSTGRES_DB: ${POSTGRES_DB:-a1_maintenance}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./backend/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-a1_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Milvus（向量库） ----
  milvus-etcd:
    container_name: a1-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - ./backend/data/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  milvus-minio:
    container_name: a1-milvus-minio
    image: minio/minio:RELEASE.2023-09-20T22-49-55Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_user}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio_password}
    volumes:
      - ./backend/data/milvus/minio:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  milvus-standalone:
    container_name: a1-milvus
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    depends_on:
      - milvus-etcd
      - milvus-minio
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "9091:9091"
    volumes:
      - ./backend/data/milvus/conf:/milvus/conf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Neo4j（知识图谱） ----
  neo4j:
    image: neo4j:5.20-community
    container_name: a1-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    volumes:
      - ./backend/data/neo4j:/data

  # ---- MinIO（应用对象存储） ----
  minio:
    image: minio/minio:RELEASE.2024-01-18T16-06-36Z
    container_name: a1-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_password}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - ./backend/data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- 后端 API ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: a1-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
      neo4j:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./backend/data:/app/data

  # ---- 前端 ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: a1-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"  # nginx
    volumes:
      - ./frontend/dist:/usr/share/nginx/html

  # ---- Nginx 反向代理（生产） ----
  nginx:
    image: nginx:1.25-alpine
    container_name: a1-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx

networks:
  default:
    name: a1-network
