[project]
name = "motoengine"
version = "0.1.0"
description = "智能文档处理与向量检索引擎"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
    "python-dotenv==1.2.2",
    "openai==2.16.0",
    "chromadb>=0.4.18",
    "pypdf==6.6.2",
    "python-docx>=1.1.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "langchain==1.2.7",
    "langchain-openai==1.1.7",
    "langchain-core==1.2.17",
    "langchain-community==0.4.1",
    "langchain-text-splitters==1.1.1",
    "sse-starlette==3.2.0",
    "jinja2==3.1.6",
    "grpcio==1.78.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
]

[project.scripts]
motoengine = "motoengine.main:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["motoengine*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
