# ============================================
# A1 设备检修智能系统 - Nginx 反向代理配置
# 适用于 LoongArch + 银河麒麟 平台
# ============================================

# 上游 - 后端 API
upstream a1_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# 上游 - 前端（已构建的静态文件）
server {
    listen 80;
    server_name _;

    # 上传文件大小限制
    client_max_body_size 100M;

    # 日志
    access_log /var/log/nginx/a1_access.log;
    error_log /var/log/nginx/a1_error.log;

    # 字符集
    charset utf-8;

    # API 路由
    location /api/ {
        proxy_pass http://a1_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时（LLM 调用可能较慢）
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 缓冲
        proxy_buffering off;
    }

    # 文档（OpenAPI / Swagger）
    location /docs {
        proxy_pass http://a1_backend/docs;
    }
    location /openapi.json {
        proxy_pass http://a1_backend/openapi.json;
    }
    location /redoc {
        proxy_pass http://a1_backend/redoc;
    }

    # 前端静态文件
    location / {
        root /opt/a1/frontend/dist;
        try_files $uri $uri/ /index.html;

        # 缓存策略
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 错误页
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

